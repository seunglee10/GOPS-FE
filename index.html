<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Asta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>GOPS Layout Runtime</title>
    <script>
      /* 첫 페인트 전에 테마를 확정한다. 이게 없으면 다크 사용자에게 라이트가 한
         프레임 번쩍인다. 저장 키와 판정 규칙은 src/theme/themeMode.ts와 같아야 한다. */
      (function () {
        try {
          var mode = window.localStorage.getItem("gops:theme");
          if (mode !== "light" && mode !== "dark" && mode !== "system") {
            mode = "light";
          }
          var dark =
            mode === "dark" ||
            (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) {
            document.documentElement.setAttribute("data-theme", "dark");
          }
        } catch (error) {
          /* localStorage 차단 환경에서는 기본값(라이트)으로 둔다. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
